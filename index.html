 <!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Would You Rather? — Communication Edition</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="prompt-screen" aria-live="polite">
      <section class="prompt-card" aria-labelledby="questionTitle">
        <div class="welcome-header">
          <img class="welcome-logo" src="blocktopia.jpg" alt="Blocktopia logo" />
          <p class="welcome-text">Welcome</p>
        </div>

        <h1 id="questionTitle">Would you rather work alone or with a team?</h1>

        <div class="choice-grid" role="group" aria-label="Answer choices">
          <button class="choice-button" type="button">Work alone</button>
          <button class="choice-button" type="button">Work with a team</button>
        </div>

        <div class="explain-panel hidden" id="explainPanel">
          <label for="nameInput">Name (optional)</label>
          <input id="nameInput" type="text" maxlength="40" autocomplete="nickname" placeholder="Leave blank to post anonymously" />
          <label for="reasonInput">Why?</label>
          <textarea id="reasonInput" rows="4" placeholder="Tell us your reason..."></textarea>
          <button class="submit-button" id="submitReason" type="button">Submit</button>
        </div>

        <section class="response-list hidden" id="responseCard" aria-label="Responses" aria-live="polite">
          <h2 class="response-heading">Responses</h2>
          <div id="responsesList"></div>
        </section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
